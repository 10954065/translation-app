services:
  - type: web
    name: polyglot-room-backend
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 run:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # set after the frontend is deployed, e.g. https://your-app.vercel.app
      - key: TRANSLATION_PROVIDER
        value: google
      - key: TRANSLATION_TIMEOUT_SECONDS
        value: "6"
      - key: TRANSLATION_MAX_RETRIES
        value: "2"
      - key: MAX_PDF_SIZE_MB
        value: "10"
      - key: PDF_UPLOAD_DIR
        value: uploads
      - key: DEMO_MODE
        value: "false"
